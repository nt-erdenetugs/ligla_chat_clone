runtime: nodejs
env: flex
runtime_config:
  operating_system: 'ubuntu22'
  runtime_version: '22'
service: 'chat-bff'

network:
  name: ligla-vpc-stg
  subnetwork_name: ligla-vpc-stg-chat-backend
  instance_tag: chat-bff
  instance_ip_mode: internal

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

handlers:
  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 4
  target_concurrent_requests: 50

env_variables:
  HOST: '0.0.0.0'
  NODE_ENV: 'production'
  GCP_PROJECT_ID: 'tt-ligla-stg'

beta_settings:
  cloud_sql_instances: 'tt-ligla-stg:asia-northeast1:chat-db-stg-instance'
