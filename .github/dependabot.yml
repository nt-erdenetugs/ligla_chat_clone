    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - front
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Group minor and patch updates
      minor-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Group major updates
      major-updates:
        update-types:
          - "major"
        patterns:
          - "*"

  # 4) Docker images
  - package-ecosystem: docker
    directory: "/backend-core"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
      - core
    commit-message:
      prefix: "chore(docker)"
      include: scope
    groups:
      # Group minor and patch updates
      minor-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Group major updates
      major-updates:
        update-types:
          - "major"
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/backend-bff"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
      - bff
    commit-message:
      prefix: "chore(docker)"
      include: scope
    groups:
      # Group minor and patch updates
      minor-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Group major updates
      major-updates:
        update-types:
          - "major"
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/frontend"
    target-branch: "develop"
    schedule:
