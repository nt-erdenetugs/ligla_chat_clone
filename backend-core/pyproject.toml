[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [
    {name = "nt-chinbat", email = "chinbat@nashatech.com"},
    {name = "nt-ebi", email = "ebi@nashatech.com"},
    {name = "nt-suuri", email = "suuri@nashatech.com"},
    {name = "nt-manlai", email = "manlai@nashatech.com"},
    {name = "nt-arsa", email = "arsa@nashatech.com"},
    {name = "nt-munkhuush", email = "munkhuush@nashatech.com"},
    {name = "nt-dukk", email = "dukk@nashatech.com"},
]
name = "backend-core"
version = "0.1.0"
description = ""
requires-python = ">=3.13.3"
dependencies = [
    "fastapi>=0.122.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.17.1",
    "gunicorn>=23.0.0",
    "pydantic[email]>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pytz>=2025.2",
    "requests>=2.32.5",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.27",
    "google-cloud-pubsub>=2.33.0",
    "google-api-python-client>=2.179.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "google-cloud-storage>=3.5.0",
    "google-cloud-secret-manager>=2.25.0",
    "google-auth>=2.40.0",
    "python-json-logger>=4.0.0",
    "google-re2>=1.1.20251105",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "ruff>=0.8.4",
    "isort>=6.0.1",
    "pytest>=9.0.3",
    "pre-commit>=4.4.0",
    "autoflake>=2.3.1",
]
db-jobs = [
    "alembic>=1.17.1",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.4",
    "python-dotenv>=1.2.2",
    "fastapi>=0.122.0",
    "google-auth>=2.40.0",
    "google-cloud-secret-manager>=2.25.0",
    "python-json-logger>=4.0.0",
    "cryptography>=44.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["app"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic"]
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "alembic",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "UP",     # pyupgrade - detects deprecated typing imports
    "I001",   # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

# UP-specific rules to catch deprecated typing usage
[tool.ruff.lint.pyupgrade]
# Keep runtime typing imports for Pydantic models
keep-runtime-typing = false

[tool.pyright]
include = ["app"]
exclude = [
    "**/__pycache__",
    "alembic/**",
    ".venv/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    "build/**",
    "dist/**",
]
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
deprecatedTreatment = "error"
reportDeprecated = "error"
reportAny = "none"
reportCallIssue = "none"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownVariableType = "none"
reportUnknownMemberType = "warning"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportPrivateUsage = "error"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
reportMissingSuperCall = "none"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportInvalidStringEscapeSequence = "error"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "warning"
reportUnresolvedImport = "error"
reportWildcardImportFromLibrary = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportUnusedExpression = "warning"
reportFunctionMemberAccess = "error"
reportPrivateImportUsage = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportReturnType = "error"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportImplicitStringConcatenation = "error"
reportCallInDefaultInitializer = "none"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportAssertUsesConstant = "error"
reportShadowedImports = "error"
reportUnusedCoroutine = "error"
reportCommentSpacing = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
defineConstant = true
strictParameterNonNoneValue = true

# Pylance/Pylint configurations specifically
[tool.pylint.master]
init-hook = "import sys; sys.path.append('.')"
load-plugins = ["pylint_pytest", "pylint_fastapi"]

[tool.pylint.messages_control]
disable = [
    # Type annotations
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Style
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "invalid-name",
    "unused-argument",
    "line-too-long",
    "fixme",
    # FastAPI patterns
    "no-else-return",
    "no-else-raise",
    "import-outside-toplevel",
    # Development
    "cyclic-import",
]
enable = [
    "useless-object-inheritance",
    "unused-import",
    "unused-variable",
    "redefined-builtin",
    "undefined-variable",
    "undefined-loop-variable",
    "duplicate-key",
    "duplicate-except",
    "unnecessary-pass",
    "unnecessary-lambda",
    "dangerous-default-value",
    "protected-access",
    "arguments-out-of-order",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "e", "db", "id", "pk", "uuid", "x", "y", "z"]

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-branches = 15
max-line-length = 120
max-locals = 20
max-returns = 10
max-statements = 60
min-public-methods = 0

[tool.pylint.exceptions]
overgeneral-exceptions = ["builtins.Exception", "builtins.BaseException"]

# Jedi language server configuration (for enterprise IDEs)
[tool.jedils]
startup_script = ""
extra_sys_path = ["app"]
watch_imports = true
auto_import_duration = 3
resolve_at_most = 25
completion_case_insensitive = true
add_bracket_after_function = true
resolve_magic_functions = true
