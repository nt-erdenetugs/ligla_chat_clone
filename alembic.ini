[alembic]
# Delegates to the backend-core Alembic configuration.
#
# This repository is a monorepo, and tools or scripts invoked from the repo root
# may default to reading `./alembic.ini`. The actual migration environment for
# backend-core lives under `backend-core/`.
script_location = backend-core/alembic

# Ensure env.py can import the app package when invoked from repo root.
prepend_sys_path = backend-core

# Logging configuration (kept minimal but complete so Alembic/env.py can call fileConfig)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
