runtime: nodejs22
service: chat-front

handlers:
  - url: /chat/(.*\..+)$
    static_files: build/\1
    upload: build/(.*\..+)$
    secure: always
  - url: /chat/.*
    static_files: build/index.html
    upload: build/index.html
    secure: always
  - url: /chat
    static_files: build/index.html
    upload: build/index.html
    secure: always

env_variables:
  PORT: '8001'
  NODE_ENV: 'production'
  VITE_BACKEND_URL: 'https://staging.autoline.link/chat'
